server.port=8080

# 微信小程序配置
# appid 会打包进前端，可提交
wechat.appid=wx6bdd20d03a50b7bf
# 密钥不要写死在仓库里；本地运行用环境变量注入：export WECHAT_SECRET=8a03...fe48
wechat.secret=${WECHAT_SECRET:changeme}

# ===== 数据库（MySQL）=====
# 连接信息全部走环境变量，方便本地/不同环境切换，密钥不入库。
# 本地运行示例：
#   export DB_PASSWORD=你的root密码
#   java -jar target/friend-scorebook-backend-0.0.1-SNAPSHOT.jar
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:scorebook}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
# ddl-auto=none：表结构完全由 src/main/resources/schema.sql 控制（DB-first，可见可改）
# sql.init.mode=always：每次启动执行 schema.sql（里面用 IF NOT EXISTS，重复执行安全）
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.encoding=UTF-8

# ===== Swagger / OpenAPI 在线接口文档 =====
# 启动后浏览器访问 http://localhost:8080/swagger-ui.html 即可看到自动生成的接口文档
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tryItEnabled=true

# ===== 用户体系 / 鉴权（Step 3）=====
# token 签名密钥：生产环境必须改！本地可用默认值，建议用环境变量注入：export APP_TOKEN_SECRET=一长串随机串
app.token.secret=${APP_TOKEN_SECRET:dev-only-secret-change-me}
# token 有效期（秒），默认 1 天
app.token.ttl-seconds=86400
# 管理员 openid 白名单（逗号分隔）；留空则系统无管理员。正式上线前在此填入你的微信号 openid
app.admin-openids=${APP_ADMIN_OPENIDS:}
# 预置头像白名单，须与前端 avatarList 保持一致（用户只能从这些里选，不允自定义上传）
app.avatar-list=avatar_01,avatar_02,avatar_03,avatar_04,avatar_05,avatar_06,avatar_07,avatar_08,avatar_09,avatar_10,avatar_12,avatar_13,avatar_14,avatar_15,avatar_16,avatar_17
